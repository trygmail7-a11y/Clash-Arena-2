name: Build Debug APK

# Runs automatically on every push to main, and can also be triggered manually
# from the Actions tab in GitHub.
#
# This workflow expects the repo to contain "clash-arena.zip" AT THE ROOT
# (uploaded directly via GitHub's "Add file → Upload files" — no need to
# extract it yourself). The workflow unzips it before building.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip clash-arena.zip
        run: |
          if [ ! -f "clash-arena.zip" ]; then
            echo "clash-arena.zip not found at repo root!"
            exit 1
          fi
          unzip -q clash-arena.zip -d extracted

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install project dependencies
        working-directory: extracted/clash-arena
        run: npm install

      - name: Add Android platform (Capacitor)
        working-directory: extracted/clash-arena
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets into Android project
        working-directory: extracted/clash-arena
        run: npx cap sync android

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x extracted/clash-arena/android/gradlew

      - name: Build debug APK
        working-directory: extracted/clash-arena/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clash-arena-debug-apk
          path: extracted/clash-arena/android/app/build/outputs/apk/debug/app-debug.apk
