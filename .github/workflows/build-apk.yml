name: Generate Release Keystore (run once)

# Run this ONCE from the Actions tab ("Run workflow"), download the
# resulting keystore, then add it as GitHub secrets so build-apk.yml can
# sign release APKs with it.
#
# IMPORTANT: Android requires every update to an app be signed with the
# EXACT SAME key as the original. Generate this once, save it somewhere
# safe, and never regenerate it once you've published a version signed
# with it — a new key means users can never update, only reinstall.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias clasharena \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ClashArena2026! \
            -keypass ClashArena2026! \
            -dname "CN=Clash Arena, OU=Clash Arena, O=Clash Arena, L=India, ST=India, C=IN"

      - name: Base64-encode for easy copy-paste into a GitHub secret
        run: base64 -w 0 release.keystore > release.keystore.base64.txt

      - name: Upload keystore + base64 text as downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            release.keystore.base64.txt
            
