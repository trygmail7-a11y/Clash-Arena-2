name: Build Debug APK

# Runs automatically on every push to main, and can also be triggered manually
# from the Actions tab in GitHub.
#
# This workflow expects the repo to contain "clash-arena.zip" AT THE ROOT
# (uploaded directly via GitHub's "Add file → Upload files" — no need to
# extract it yourself). The workflow unzips it before building.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip clash-arena-updated.zip
        run: |
          if [ ! -f "clash-arena-updated.zip" ]; then
            echo "clash-arena-updated.zip not found at repo root!"
            exit 1
          fi
          unzip -q clash-arena-updated.zip -d extracted

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install project dependencies
        working-directory: extracted/clash-arena
        run: npm install

      - name: Add push notifications & browser plugins
        working-directory: extracted/clash-arena
        run: npm install @capacitor/push-notifications @capacitor/browser

      - name: Add Android platform (Capacitor)
        working-directory: extracted/clash-arena
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Restore google-services.json from secret
        working-directory: extracted/clash-arena
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Wire up Firebase Gradle plugin (fixes crash-on-launch)
        # Having google-services.json present is not enough on its own —
        # without the Google Services Gradle plugin actually processing it,
        # Firebase fails to initialize and the app crashes immediately after
        # the splash screen. This script (in scripts/) adds the required
        # classpath + apply plugin lines to the generated gradle files.
        working-directory: extracted/clash-arena
        run: python3 scripts/setup-firebase-gradle.py

      - name: Generate app icon & splash screen from resources/
        working-directory: extracted/clash-arena
        run: npx capacitor-assets generate --android

      - name: Sync web assets into Android project
        working-directory: extracted/clash-arena
        run: npx cap sync android

      - name: Fix pink default screen before loading (Android theme patch)
        # Android's default Material template ships a light purple/pink
        # windowBackground, which flashes for a moment before our own splash
        # screen takes over. This script (already in scripts/) forces every
        # style/color that controls that flash to white. It must run from
        # the project root, since it looks for "android/app/..." relative
        # to the current folder.
        working-directory: extracted/clash-arena
        run: python3 scripts/patch-android-theme.py

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x extracted/clash-arena/android/gradlew

      - name: Build debug APK
        working-directory: extracted/clash-arena/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clash-arena-debug-apk
          path: extracted/clash-arena/android/app/build/outputs/apk/debug/app-debug.apk
