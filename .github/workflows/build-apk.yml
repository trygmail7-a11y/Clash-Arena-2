name: Build Admin Panel APK

# Runs automatically on every push to main, and can also be triggered manually
# from the Actions tab in GitHub.
#
# This workflow expects the repo to contain "clash-arena-admin.zip" AT THE
# ROOT (uploaded via GitHub's "Add file â†’ Upload files"). The workflow
# unzips it before building.
#
# Produces a SIGNED release APK. Reuses the SAME signing secrets as the
# main Clash Arena app's build workflow â€” one signing key can safely sign
# multiple different apps, no need for a separate keystore:
#   RELEASE_KEYSTORE_BASE64
#   RELEASE_STORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
# (Copy these same secret values into this repo if they're not already
# here â€” GitHub secrets don't automatically share across repos.)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip clash-arena-admin.zip
        run: |
          if [ ! -f "clash-arena-admin.zip" ]; then
            echo "clash-arena-admin.zip not found at repo root!"
            exit 1
          fi
          unzip -q clash-arena-admin.zip -d extracted

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install project dependencies
        working-directory: extracted
        run: npm install

      - name: Add Android platform (Capacitor)
        working-directory: extracted
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate app icon & splash screen from resources/
        working-directory: extracted
        run: npx capacitor-assets generate --android

      - name: Sync web assets into Android project
        working-directory: extracted
        run: npx cap sync android

      - name: Fix pink default screen before loading (Android theme patch)
        working-directory: extracted
        run: python3 scripts/patch-android-theme.py

      - name: Restore release keystore from secret
        working-directory: extracted
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Wire up release signing config
        working-directory: extracted
        run: python3 scripts/add-release-signing.py

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x extracted/android/gradlew

      - name: Build signed release APK
        working-directory: extracted/android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clash-arena-admin-release-apk
          path: extracted/android/app/build/outputs/apk/release/app-release.apk
